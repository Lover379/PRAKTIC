<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг пожаров</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <div class="dashboard">
        
        <header class="header">
            <h1>Мониторинг пожаров и вегетационных индексов</h1>
        </header>

        <div class="row">
            <div class="box">
                <div class="box-header">
                    <h5>Карта очагов пожаров</h5>
                    <button id="btn-toggle-theme" class="btn-theme">Светлая карта</button>
                </div>
                
                <div class="filter-container">
                    <label for="month-slider">Период: <span id="month-label">Март</span></label>
                    <div class="slider-wrapper">
                        <input type="range" id="month-slider" min="3" max="10" value="3" step="1" list="months-list">
                        <datalist id="months-list">
                            <option value="3" label="Мар"></option>
                            <option value="4" label="Апр"></option>
                            <option value="5" label="Май"></option>
                            <option value="6" label="Июн"></option>
                            <option value="7" label="Июл"></option>
                            <option value="8" label="Авг"></option>
                            <option value="9" label="Сен"></option>
                            <option value="10" label="Окт"></option>
                        </datalist>
                        <div class="slider-labels">
                            <span>Мар</span>
                            <span>Апр</span>
                            <span>Май</span>
                            <span>Июн</span>
                            <span>Июл</span>
                            <span>Авг</span>
                            <span>Сен</span>
                            <span>Окт</span>
                        </div>
                    </div>
                </div>

                <div id="cnt-map" class="block">
                    <span></span>
                </div>
            </div>
            <div class="box">
                <h5>Матрица индексов</h5>
                <div id="cnt-heat" class="block">
                    <span>[ Тепловая матрица ]</span>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="box full-width">
                <h5>Динамика индексов</h5>
                <div id="cnt-line" class="block">
                    <span>[ Временные ряды ]</span>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
